<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="../fonts/paperlogy/paperlogy.css">
  <style>
    :root { --canvas-w: 1080px; --canvas-h: 1440px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e9eef3; font-family: var(--ptp-font-family); }
    .canvas {
      position: relative; overflow: hidden;
      width: var(--canvas-w); height: var(--canvas-h);
      color: #fff; isolation: isolate;
    }
    .scene {
      position: absolute; inset: 0; z-index: -4;
      background-color: #18364f;
      background-image: url('{{BACKGROUND_IMAGE}}');
      background-size: cover; background-position: center;
      transform: scale(1.015);
    }
    .atmosphere {
      position: absolute; inset: 0; z-index: -3;
      background:
        radial-gradient(circle at 78% 42%, rgba(239,125,0,.28), transparent 34%),
        linear-gradient(180deg, rgba(6,65,145,.18), rgba(5,23,40,.82) 83%);
      mix-blend-mode: normal;
    }
    .context-art { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .character-stage { position: absolute; right: 40px; bottom: 92px; z-index: 1; width: 440px; height: 670px; }
    .character { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 28px 24px rgba(3,16,29,.34)); }
    .content { position: relative; z-index: 2; height: 100%; padding: 78px; display: grid; grid-template-rows: auto 1fr auto; gap: 40px; }
    .eyebrow { display: inline-flex; margin: 0 0 18px; padding: 12px 20px; border: 1px solid rgba(255,255,255,.38); border-radius: 999px; background: rgba(7,37,63,.52); backdrop-filter: blur(14px); font-size: 31px; font-weight: 700; }
    h1 { max-width: 860px; margin: 0; text-wrap: balance; font-size: 82px; line-height: 1.07; letter-spacing: -0.04em; font-weight: 800; text-shadow: 0 4px 24px rgba(0,0,0,.28); }
    .hero { align-self: center; width: 610px; padding: 42px 44px; border: 1px solid rgba(255,255,255,.34); border-radius: 34px; background: rgba(6,30,51,.60); box-shadow: 0 22px 70px rgba(2,14,25,.28); backdrop-filter: blur(20px); }
    .metric { margin: 0 0 24px; color: #ffad4d; font-size: 102px; line-height: 1; font-weight: 900; }
    .body { margin: 0; max-width: 560px; font-size: 36px; line-height: 1.45; font-weight: 500; }
    .cta { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 26px 30px; border-radius: 22px; background: rgba(255,255,255,.92); color: #102a43; font-size: 32px; font-weight: 700; }
    .draft::after { content: "검토 전 초안"; position: absolute; right: 34px; top: 30px; color: #102a43; opacity: .38; font-size: 24px; font-weight: 600; }
    @page { size: 1080px 1440px; margin: 0; }
    @media print { html, body { background: transparent; } }
  </style>
</head>
<body>
  <main class="canvas draft" data-card-page="1" aria-label="{{ALT_TEXT}}">
    <div class="scene" data-layer="background" aria-hidden="true"></div>
    <div class="atmosphere" data-layer="atmosphere" aria-hidden="true"></div>
    <img class="context-art" data-layer="context" src="{{CONTEXT_IMAGE}}" alt="">
    <div class="character-stage" data-layer="character">
      <img class="character" src="{{CHARACTER_IMAGE}}" alt="{{CHARACTER_ALT}}">
    </div>
    <div class="content">
      <header data-layer="typography">
        <p class="eyebrow">{{EYEBROW}}</p>
        <h1>{{HEADLINE}}</h1>
      </header>
      <section class="hero" data-layer="information">
        <p class="metric">{{HERO_METRIC}}</p>
        <p class="body">{{BODY}}</p>
      </section>
      <footer class="cta" data-layer="brand-legal"><span>{{CALL_TO_ACTION}}</span><span>{{CONTACT}}</span></footer>
    </div>
  </main>
</body>
</html>
