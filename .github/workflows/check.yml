name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 단위 테스트
        run: npm test

      - name: 스킬·개인정보·마켓플레이스 점검
        run: npm run check

      - name: 실행 코드 변경 확인
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -E '^skills/[^/]+/scripts/'; then
            echo "::warning::실행 코드 검토 필요"
          fi
