title: 회의 결과문서 작성
summary: 회의 기안문과 영수증을 주면 회의록·방명록(서명란 빈칸)·지출증빙서를 포항TP 양식 HWPX로 작성
category: 회의·행정
version: 1.0.0
owner: 포항테크노파크
outputs: [hwpx]
tags: [회의록, 방명록, 지출증빙서, 영수증, 회의비, 한글 양식]
examples:
  - "첨부한 기안문과 영수증으로 회의록, 방명록, 지출증빙서 만들어줘"
  - "이 회의 기안문의 참석자로 방명록 만들어줘"
  - "영수증 3장을 지출증빙서 한 파일로 모아줘"
process:
  - { title: 자료 받기, desc: "회의 기안문·영수증·논의 메모" }
  - { title: 정보 추출, desc: "회의명·참석자·예산과목·사용 내역" }
  - { title: 문서 작성, desc: "회의록·방명록(서명란 빈칸)·지출증빙서" }
  - { title: 맞춤 검증, desc: "회의명·인원·금액 합계 일치 확인" }
  - { title: HWPX 전달, desc: "포항TP 양식 그대로 세 파일 전달" }
compat:
  claude:  { level: full,    note: 세 문서 HWPX 파일 생성까지 (PC에서는 Python과 lxml 필요) }
  codex:   { level: full,    note: 세 문서 HWPX 파일 생성까지 (Python과 lxml 필요) }
  chatgpt: { level: partial, note: 회의록 문안·참석자 정렬·지출 내역 정리까지. HWPX는 양식에 직접 붙여넣기 }
  gemini:  { level: partial, note: 회의록 문안·참석자 정렬·지출 내역 정리까지. HWPX는 양식에 직접 붙여넣기 }
