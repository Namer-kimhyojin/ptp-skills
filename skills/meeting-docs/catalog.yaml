title: 회의 결과문서 작성
summary: 회의 기안문과 영수증을 주면 회의록·방명록(서명란 빈칸)·지출증빙서를 포항TP 양식 HWPX로 작성
category: 회의·행정
version: 1.0.0
owner: 포항테크노파크
