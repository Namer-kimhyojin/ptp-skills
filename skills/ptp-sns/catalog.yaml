title: SNS 홍보물 제작·게시
summary: 사업공고·행사·기관소개를 홍보 이미지·카드뉴스·웹툰·짧은 영상으로 만들고, 사실·QR·접수기간 검수 후 재단 인스타그램·페이스북에 게시
category: 보도·홍보
version: 2.19.0
owner: 포항테크노파크
outputs: [png, mp4, text]
tags: [SNS, 인스타그램, 페이스북, 카드뉴스, 웹툰, 테오·피오, 사업공고, QR]
examples:
  - "이 사업공고를 카드뉴스로 만들어줘. 테오·피오를 쓰고 검수 후 재단 인스타그램과 페이스북에 게시해줘"
  - "접수중인 사업공고 중 아직 SNS에 안 올린 공고를 찾아줘"
  - "이 행사를 캐릭터 없이 소개하는 홍보 이미지 한 장으로 만들어줘. 파일만 전달해줘"
# Gemini는 한 스킬에 파일 100개까지라, Gemini에서 쓰지 않는 스크립트·다른 기관 로고를 Gemini용 zip에서 뺀다(재단 CI와 캐릭터는 남김).
gemini_exclude:
  - scripts/
  - agents/
  - assets/review/
  - assets/brand-identities/gyeongbuk/
  - assets/brand-identities/kait/
  - assets/brand-identities/keit/
  - assets/brand-identities/ketep/
  - assets/brand-identities/kiat/
  - assets/brand-identities/mcee/
  - assets/brand-identities/motir/
  - assets/brand-identities/msit/
  - assets/brand-identities/mss/
  - assets/brand-identities/pohang/
process:
  - { title: 요청 확인, desc: "형식·캐릭터·게시 범위 선택" }
  - { title: 공고 정리, desc: "공고 수집, 대상·기간·신청 방법, 제작 이력 확인" }
  - { title: 제작, desc: "홍보 이미지·카드뉴스·웹툰·영상과 QR" }
  - { title: 검수, desc: "문구·QR 해독·접수기간·채널 미리보기" }
  - { title: 게시·기록, desc: "인스타그램·페이스북 게시 후 장부 기록" }
compat:
  claude:  { level: partial, note: "공고 수집·문안·QR·검수, 캐릭터 없는 홍보 이미지(글자 조판)까지. 이미지 생성 도구가 없어 캐릭터 장면·웹툰 그림은 다른 도구 결과를 받아 씀. 게시는 확인 후 브라우저로" }
  chatgpt: { level: full,    note: "원래 사용 환경. Codex 화면에서 이미지 생성·카드뉴스·웹툰·영상·게시까지 (Python 필요). 대화에서는 문안·이미지 생성까지" }
  gemini:  { level: partial, note: "문안·구성과 캐릭터 시트를 참고한 이미지 생성까지. 인터넷이 필요한 스크립트·장부·게시는 안 됨" }
former_names: [ptp-sns-tool]
